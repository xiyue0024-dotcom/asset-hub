name: 每日更新素材库

on:
  # 2026-11-14 起素材源统一改为 Telegram（本机 tg_fetch.py 抓取），
  # 已清空全部 Commons 素材。每日自动采集会把旧素材重新灌回，故停用定时任务。
  # 静态站发布改为：本机抓完 → build_static.py → 人工确认后提交。
  # schedule:
  #   - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 自动采集/自动提交已全面停用。原因：
      #   1. 素材源改为 Telegram，抓取需要本机会话（tg_session.session，不入库）；
      #   2. 远端 data/library.db 若仍是旧版，CI 一跑就会把已清空的 Commons 素材重新导出上线；
      #   3. 避免自动 push 把未经确认的内容发布到公开 Pages。
      # 正确发布流程（本机）：tg_fetch.py --run → build_static.py → 人工确认 → git push
      - name: 已停用（发布走本机流程）
        run: |
          echo "自动更新已停用。素材源为 Telegram，请在本机执行 tg_fetch.py --run 与 build_static.py，确认后再提交。"
