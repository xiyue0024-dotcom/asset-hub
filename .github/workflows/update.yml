name: 每日更新素材库

on:
  schedule:
    # UTC 23:00 = 北京时间次日 07:00
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取最新素材
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python server.py update

      # 新增的图必须过质量门禁，否则会直接以「其他」场景、脏作者名进站。
      # 顺序有讲究：先补 Commons 分类（地域/场景判定的依据）→ 重算标记 → 清垃圾
      # → 清境外 → 落场景 → 补场景 → 洗作者 → 画质评分
      - name: 质量门禁
        run: |
          python server.py cats
          python server.py from_cats
          python server.py clean
          python server.py clean_foreign
          python server.py clean_generic
          python server.py life_scenes
          python server.py fill_scene
          python server.py fix_meta
          python server.py quality 400

      - name: 导出静态站点
        run: python build_static.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/library.db docs
          if git diff --staged --quiet; then
            echo "没有新增素材，跳过提交"
          else
            git commit -m "chore: 每日更新素材库 $(date -u +%Y-%m-%d)"
            git push
          fi
