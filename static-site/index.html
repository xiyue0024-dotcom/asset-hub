<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印尼 · 新加坡 素材库</title>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="dns-prefetch" href="https://upload.wikimedia.org">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="progress" id="progress"></div>

<header class="topbar">
  <div class="brand">
    <span class="mark">素</span>
    <div class="brand-txt">
      <h1>印尼 · 新加坡素材库</h1>
      <p>生活 / 旅游 视觉素材检索</p>
    </div>
  </div>

  <div class="searchwrap">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5" stroke-linecap="round"></path>
    </svg>
    <input id="q" type="search" placeholder="搜索：巴厘岛 海滩 / 乌布 稻田 / 新加坡 咖啡 / 沙嗲" autocomplete="off" spellcheck="false">
    <button id="clearq" class="clearq" hidden aria-label="清空">×</button>
  </div>

  <div class="topmeta">
    <div class="stat"><b id="statTotal">—</b><span>素材</span></div>
    <div class="stat"><b id="statSaved">0</b><span>我的收藏</span></div>
    <div class="stat"><b id="statUpdate">—</b><span>上次更新</span></div>
  </div>
</header>

<section class="filters">
  <div class="frow">
    <div class="seg" id="countrySeg">
      <button data-v="" class="on">全部</button>
      <button data-v="印度尼西亚">印度尼西亚</button>
      <button data-v="新加坡">新加坡</button>
    </div>

    <select id="citySel" class="sel"><option value="">全部城市</option></select>

    <div class="seg" id="orientSeg">
      <button data-v="" class="on">全部比例</button>
      <button data-v="landscape">横版</button>
      <button data-v="portrait">竖版</button>
    </div>

    <label class="toggle"><input type="checkbox" id="savedOnly"><span>只看收藏</span></label>
  </div>

  <div class="frow">
    <span class="flabel">质量过滤</span>
    <label class="toggle"><input type="checkbox" id="optHd" checked><span>只看高清</span></label>
    <label class="toggle"><input type="checkbox" id="optWm" checked><span>隐藏疑似水印</span></label>
    <label class="toggle"><input type="checkbox" id="optSelfie" checked><span>隐藏自拍/单人像</span></label>
    <label class="toggle"><input type="checkbox" id="optBlur"><span>隐藏模糊</span></label>
    <span class="qinfo" id="qinfo"></span>
  </div>

  <div class="chips" id="sceneChips"></div>
</section>

<main>
  <div class="meta" id="resultMeta">正在加载素材索引…</div>
  <div class="notice" id="notice" hidden></div>
  <div class="grid" id="grid"></div>

  <div class="empty" id="empty" hidden>
    <div class="empty-in">
      <div class="empty-ico">∅</div>
      <h2 id="emptyTitle">没有找到匹配的素材</h2>
      <p id="emptyText"></p>
      <div class="empty-acts">
        <button class="btn primary" id="emptyClear">清空关键词</button>
      </div>
      <p class="empty-hint">素材库不会用不相关的图片凑数。没搜到就是没搜到。</p>
    </div>
  </div>

  <div class="sentinel" id="sentinel"></div>
  <div class="more"><button id="moreBtn" class="btn" hidden>加载更多</button></div>

  <footer class="foot">
    <span id="footInfo">素材来自 Wikimedia Commons，版权归原作者所有</span>
    <span class="foot-sep">·</span>
    <span>索引每天 07:00 自动更新</span>
  </footer>
</main>

<div class="lb" id="lb" hidden>
  <div class="lb-backdrop" data-close></div>
  <div class="lb-body">
    <div class="lb-stage">
      <img id="lbImg" alt="">
      <button class="nav prev" id="lbPrev" aria-label="上一张">‹</button>
      <button class="nav next" id="lbNext" aria-label="下一张">›</button>
    </div>
    <aside class="lb-side">
      <button class="lb-close" data-close aria-label="关闭">×</button>
      <h2 id="lbTitle"></h2>
      <div class="lb-badges" id="lbBadges"></div>
      <dl id="lbMeta"></dl>
      <div class="lb-actions">
        <a id="lbDl" class="btn primary" target="_blank" rel="noopener">打开原图</a>
        <button id="lbSave" class="btn">收藏</button>
        <button id="lbHide" class="btn">隐藏此图（水印/人物）</button>
        <button id="lbCopy" class="btn">复制署名</button>
      </div>
      <a id="lbSrc" class="lb-link" target="_blank" rel="noopener">在来源页查看 ↗</a>
    </aside>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
