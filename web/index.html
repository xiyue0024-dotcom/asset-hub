<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG 生活素材库</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="progress" id="progress"></div>

<header class="topbar">
  <div class="brand">
    <span class="mark">素</span>
    <div class="brand-txt">
      <h1>TG 生活素材库</h1>
      <p>Telegram 频道 · 生活实拍</p>
    </div>
  </div>

  <div class="searchwrap">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5" stroke-linecap="round"></path>
    </svg>
    <input id="q" type="search" placeholder="搜索频道 / 编号 / 文案" autocomplete="off" spellcheck="false">
    <button id="clearq" class="clearq" hidden aria-label="清空">×</button>
  </div>

  <div class="topmeta">
    <div class="stat"><b id="statTotal">—</b><span>素材</span></div>
    <div class="stat"><b id="statSaved">0</b><span>收藏</span></div>
    <div class="stat"><b id="statUpdate">—</b><span>上次更新</span></div>
  </div>
</header>

<section class="filters">
  <div class="fhead">
    <span class="fhead-t">筛选</span>
    <span class="fsum" id="filterSummary">全部素材</span>
    <button class="ghost sm" id="resetBtn" title="清空全部筛选与关键词">重置筛选</button>
    <button class="ghost sm" id="foldBtn" aria-expanded="true">收起选项</button>
  </div>

  <div id="taxGroups" class="taxgroups"></div>

  <div class="frow ftools">
    <label class="toggle"><input type="checkbox" id="savedOnly"><span>只看收藏</span></label>
    <span class="kbd-hint">按 <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 关闭 · <kbd>←</kbd><kbd>→</kbd> 翻图</span>
    <span class="qinfo" id="qinfo"></span>
  </div>
</section>

<main>
  <div class="meta" id="resultMeta"></div>
  <div class="notice" id="notice" hidden></div>
  <div class="grid" id="grid"></div>

  <div class="empty" id="empty" hidden>
    <div class="empty-in">
      <div class="empty-ico">∅</div>
      <h2 id="emptyTitle">没有找到匹配的素材</h2>
      <p id="emptyText"></p>
      <div class="empty-acts">
        <button class="btn primary" id="emptyReset">重置筛选</button>
      </div>
      <p class="empty-hint">纯图素材没有文字描述，可按「来源频道」或「编号」检索。</p>
    </div>
  </div>

  <div class="sentinel" id="sentinel"></div>
  <div class="more"><button id="moreBtn" class="btn" hidden>加载更多</button></div>

  <footer class="foot">
    <span id="footInfo">素材来自 Telegram 频道</span>
    <span class="foot-sep">·</span>
    <span>来源与授权不明，仅限个人使用</span>
  </footer>
</main>

<div class="lb" id="lb" hidden>
  <div class="lb-backdrop" data-close></div>
  <div class="lb-body">
    <div class="lb-stage">
      <img id="lbImg" alt="">
      <button class="nav prev" id="lbPrev" aria-label="上一张">‹</button>
      <button class="nav next" id="lbNext" aria-label="下一张">›</button>
      <span class="lb-count" id="lbCount"></span>
    </div>
    <aside class="lb-side">
      <button class="lb-close" data-close aria-label="关闭">×</button>
      <h2 id="lbTitle"></h2>
      <div class="lb-badges" id="lbBadges"></div>
      <dl id="lbMeta"></dl>
      <div class="lb-actions">
        <a id="lbDl" class="btn primary" download>下载原图</a>
        <button id="lbSave" class="btn">收藏</button>
        <button id="lbHide" class="btn">隐藏此图</button>
      </div>
      <a id="lbSrc" class="lb-link" target="_blank" rel="noopener">在 Telegram 打开原帖 ↗</a>
    </aside>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
